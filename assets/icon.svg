<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecec"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824pt rounded square centred on a 1024pt canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
  <g transform="translate(512 512)" stroke="#3d3d3d" stroke-width="17" stroke-linecap="round" fill="none">
    <g id="major">
      <line x1="0" y1="-300" x2="0" y2="-237"/>
    </g>
    <use href="#major" transform="rotate(90)"/>
    <use href="#major" transform="rotate(180)"/>
    <use href="#major" transform="rotate(270)"/>
    <g id="minor"><line x1="0" y1="-298" x2="0" y2="-266"/></g>
    <use href="#minor" transform="rotate(30)"/>
    <use href="#minor" transform="rotate(60)"/>
    <use href="#minor" transform="rotate(120)"/>
    <use href="#minor" transform="rotate(150)"/>
    <use href="#minor" transform="rotate(210)"/>
    <use href="#minor" transform="rotate(240)"/>
    <use href="#minor" transform="rotate(300)"/>
    <use href="#minor" transform="rotate(330)"/>
    <!-- hands: hour toward 10:30, minute toward 1:30 -->
    <line x1="-25" y1="-25" x2="-88" y2="-88"/>
    <line x1="26" y1="-26" x2="178" y2="-178"/>
    <circle r="37"/>
  </g>
</svg>
